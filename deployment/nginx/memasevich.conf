# /etc/nginx/sites-available/memasevich.ru
# Enable with: sudo ln -s /etc/nginx/sites-available/memasevich.ru /etc/nginx/sites-enabled/memasevich.ru

server {
    listen 80;
    listen [::]:80;
    server_name memasevich.ru www.memasevich.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/memasevich/current;
    }

    location / {
        return 301 https://memasevich.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name memasevich.ru www.memasevich.ru;

    root /var/www/memasevich/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/memasevich.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memasevich.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    # Enable HSTS only after HTTPS and all required subdomains are verified.
    add_header Strict-Transport-Security "max-age=86400" always;

    location ~ /\.(?!well-known) { deny all; }
    location ~* (\.env|\.pem|\.key|\.bak|\.sql|\.log|\.map)$ { deny all; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
